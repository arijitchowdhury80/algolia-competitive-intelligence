# Tenant/competitor/source plan for scripts/daily_production_run.py.
#
# Same shape and content as scripts/gate7_e2e_rehearsal.py's TENANT_PLAN dict
# (moved here so the production runner loads it instead of hardcoding it).
# <= 6 sources per tenant (3 each). Blogs chosen for real reachability and
# content, matching the Gate 7 rehearsal plan.

algolia:
  - name: Elastic
    domain: elastic.co
    url: https://www.elastic.co/blog
    family: blog
  - name: Constructor
    domain: constructor.com
    url: https://www.constructor.com/blog
    family: blog
  - name: Coveo
    domain: coveo.com
    url: https://www.coveo.com/blog
    family: blog

spryker:
  - name: commercetools
    domain: commercetools.com
    url: https://commercetools.com/blog
    family: blog
  - name: BigCommerce
    domain: bigcommerce.com
    url: https://www.bigcommerce.com/blog/
    family: blog
  - name: VTEX
    domain: vtex.com
    url: https://vtex.com/en-us/blog/
    family: blog

amplitude:
  - name: Mixpanel
    domain: mixpanel.com
    url: https://mixpanel.com/blog/
    family: blog
  - name: PostHog
    domain: posthog.com
    url: https://posthog.com/blog
    family: blog
  - name: Heap
    domain: heap.io
    url: https://www.heap.io/blog
    family: blog

# Own-brand sources per tenant (docs/planning/CI-OS-product-doctrine-2026-07-08.md
# Addendum 2 point 2): the tenant's own blog/newsroom/press feed the "where
# you are" leg of the three-position framing via src/cios/ownbrand. Same
# real-URL, real-reachability bar as the competitor sources above.
own_brand:
  algolia:
    - name: Algolia Blog
      source_type: own_blog
      url: https://www.algolia.com/blog
    - name: Algolia Newsroom
      source_type: newsroom
      url: https://www.algolia.com/newsroom/

  spryker:
    - name: Spryker Blog
      source_type: own_blog
      url: https://spryker.com/en/blog/
    - name: Spryker Newsroom
      source_type: newsroom
      url: https://spryker.com/en/news/

  amplitude:
    - name: Amplitude Blog
      source_type: own_blog
      url: https://amplitude.com/blog
    - name: Amplitude Newsroom
      source_type: newsroom
      url: https://amplitude.com/newsroom
