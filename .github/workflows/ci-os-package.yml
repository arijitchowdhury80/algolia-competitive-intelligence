name: CI-OS package CI

on:
  pull_request:
    branches:
      - ci-os-package-main
  push:
    branches:
      - ci-os-package-main

permissions:
  contents: read

concurrency:
  group: ci-os-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and validation tools
        run: python3 -m pip install -e ".[dev]" pyright mypy ruff
      - name: Verify installed dependencies
        run: python3 -m pip check
      - name: Type-check publication boundary
        run: |
          pyright --project pyright-phase2.json
          mypy --strict src/cios/publication
      - name: Lint Phase 2 surfaces
        run: >-
          ruff check
          src/cios/publication
          scripts/publish_generation.py
          scripts/check_e2e_launch_readiness.py
          tests/publication
          tests/integration/test_publication_store.py
          tests/scripts/test_publish_generation.py
          tests/scripts/test_check_e2e_launch_readiness.py
          tests/integration/conftest.py
      - name: Run default suite
        run: python3 -m pytest -q
      - name: Verify package contract
        run: >-
          python3 scripts/verify_hermes_package_contract.py
          --app-dir .
          --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --verdict-output /tmp/cios-package-verdict.json

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cios
          POSTGRES_USER: cios_dev
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cios_dev -d cios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIOS_ALLOW_SCHEMA_RESET_FOR_TESTS: "1"
      CIOS_DATABASE_URL: postgresql://cios_dev:ci_test_only@127.0.0.1:5432/cios
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package test dependencies
        run: python3 -m pip install -e ".[dev]"
      - name: Run real Postgres integration suite
        run: python3 -m pytest -m integration -q
