[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cios"
version = "0.1.0"
description = "CI-OS (Argus) — competitive intelligence operating system platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
ga4 = [
    "google-analytics-data>=0.18",
    "google-auth>=2.0",
]
e2e = [
    "playwright>=1.45",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "cios[e2e]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
